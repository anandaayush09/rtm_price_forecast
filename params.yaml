data:
  raw_path: data/raw/price_data.csv
  clean_path: data/interim/clean.parquet
  report_path: reports/data_quality.json
  # Bounds only catch obviously broken rows. They are not market rules.
  # ASSUMPTION: prices in INR/MWh stay between 0 and 20000 (confirm against the CERC price cap orders).
  price_min: 0.0
  price_max: 20000.0
  # The purchase and selling bid columns look like volumes in MW (values 200 to 27000), not prices.
  # ASSUMPTION: bid volumes stay between 0 and 100000 MW.
  bid_min: 0.0
  bid_max: 100000.0
  # ASSUMPTION: all-India demand in MW stays between 50000 and 300000.
  demand_min: 50000.0
  demand_max: 300000.0
  # Chosen from the data: demand repeats exactly for 2 or 3 blocks in 12 places and for 4 to 87 blocks in
  # 16 places. Four blocks (one hour) is the cut-off for calling a run of equal values stale.
  stale_min_blocks: 4

features:
  features_path: data/processed/features.parquet
  report_path: reports/feature_report.json
  # Chosen with src/rtm_forecast/imputation.py (notebook 04): straight-line fill had the lowest error.
  imputation: linear
  lags_days: [1, 7]
  min_history_days: 7
  # "mask" sets demand to missing where it looks unreliable, "keep" leaves it as published.
  demand_policy: mask
  # Demand before this date is treated as unreliable (see the data audit).
  demand_reliable_from: "2020-10-16"
  # Candidate scales for the asinh transform. The choice is made on the training part only.
  asinh_scales: [50, 100, 250, 500, 1000, 2000]
  asinh_train_days: 90
  holidays_path: config/holidays.yaml
