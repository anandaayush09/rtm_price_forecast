# Days treated as holidays by the feature builder.
#
# Source for 2020: Government of India, Department of Personnel and Training, Office Memorandum
# F.No.12/1/2019-JCA-2 dated 18.06.2019, Annexure-I, "List of holidays during the year 2020 for
# administrative offices of Central Government located at Delhi / New Delhi". The list was read from
# a reproduction of the memorandum at
# https://www.staffnews.in/2019/06/list-of-gazetted-holidays-during-year-2020.html
# (the original memorandum itself was not opened).
#
# These are central government holidays. State holidays and restricted holidays are not included.
# 2025 and 2026 are PLACEHOLDER: the lists for the newer data window have not been added yet.
sources:
  - years: [2020]
    document: "DoPT OM F.No.12/1/2019-JCA-2 dated 18.06.2019, Annexure-I"
  - years: [2025, 2026]
    document: PLACEHOLDER
holidays:
  - {date: 2020-01-26, name: Republic Day}
  - {date: 2020-03-10, name: Holi}
  - {date: 2020-04-02, name: Ram Navami}
  - {date: 2020-04-06, name: Mahavir Jayanti}
  - {date: 2020-04-10, name: Good Friday}
  - {date: 2020-05-07, name: Budha Purnima}
  - {date: 2020-05-25, name: Id-ul-Fitr}
  - {date: 2020-08-01, name: Id-ul-Zuha (Bakrid)}
  - {date: 2020-08-12, name: Janmashtami}
  - {date: 2020-08-15, name: Independence Day}
  - {date: 2020-08-30, name: Muharram}
  - {date: 2020-10-02, name: Mahatma Gandhi's Birthday}
  - {date: 2020-10-25, name: Dussehra}
  - {date: 2020-10-30, name: Milad-un-Nabi or Id-e-Milad}
  - {date: 2020-11-14, name: Diwali (Deepavali)}
  - {date: 2020-11-30, name: Guru Nanak's Birthday}
  - {date: 2020-12-25, name: Christmas Day}
