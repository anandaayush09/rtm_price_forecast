[project]
name = "rtm-forecast"
version = "0.1.0"
description = "Data pipeline and model benchmark for real-time electricity market price forecasting on the Indian Energy Exchange"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=16",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtm_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["original", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pandera.mypy"]
