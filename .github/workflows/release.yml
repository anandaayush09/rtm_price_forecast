# Runs when a version tag such as v1.0.0 is pushed: publishes the image and creates the Release.
# It can also be started by hand from the Actions tab: a manual run builds the image and checks
# that the command line starts in it, and publishes nothing.
# The image holds code only (the Dockerfile copies no data). No result files are attached to the
# Release: forecasts and score tables come from published exchange prices, so they stay out until
# the exchange's terms of use have been checked.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and check the command line starts in it
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rtm_price_forecast"
          docker build -t "$image:${TAG//\//-}" -t "$image:latest" .
          docker run --rm "$image:${TAG//\//-}" --help
      - name: Push the image
        if: github.ref_type == 'tag'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rtm_price_forecast"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$image:$TAG"
          docker push "$image:latest"
      - name: Create the Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
