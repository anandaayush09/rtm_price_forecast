name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=rtm_forecast --cov-report=term-missing
      - name: Build the image and check the command line starts in it
        run: |
          docker build -t rtm-forecast .
          docker run --rm rtm-forecast --help
      - name: Rebuild the data pipeline and compare the quality report
        run: |
          uv run dvc repro
          git diff --exit-code reports/data_quality.json
      - name: Execute notebooks
        run: uv run python scripts/execute_notebooks.py --check
